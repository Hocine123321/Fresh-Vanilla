name: Sync Modrinth versions/changelog/source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-modrinth.yml'
  schedule:
    - cron: '0 */6 * * *'   # every 6h — adjust if you want faster/slower polling

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync from Modrinth (skips heavy work if latest release is unchanged)
        run: |
          python3 - << 'PYEOF'
          import json, urllib.request, zipfile, io, os, re, shutil

          PROJECT_ID = "H1WDyVEk"
          H = {"User-Agent": "fresh-vanilla-github-sync/1.0 (github.com/Hocine123321/Fresh-Vanilla)"}

          def get(url):
              req = urllib.request.Request(url, headers=H)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          def get_bytes(url):
              req = urllib.request.Request(url, headers=H)
              with urllib.request.urlopen(req) as r:
                  return r.read()

          versions = get(f"https://api.modrinth.com/v2/project/{PROJECT_ID}/version")
          versions.sort(key=lambda v: v["date_published"], reverse=True)

          releases = [v for v in versions if v.get("version_type") == "release"]
          target = releases[0] if releases else versions[0]

          current_version = None
          if os.path.exists("pack/VERSION"):
              with open("pack/VERSION") as f:
                  current_version = f.readline().strip()

          up_to_date = (current_version == target["version_number"])
          print(f"latest on modrinth: {target['version_number']} | in repo: {current_version} | up to date: {up_to_date}")

          # ---- CHANGELOG.md: cheap, always safe to refresh (uses data already fetched) ----
          with open("CHANGELOG.md", "w") as f:
              f.write("# Changelog\n\nAuto-generated from the Modrinth version history. Do not hand-edit; "
                      "this file is refreshed automatically (see .github/workflows/sync-modrinth.yml).\n\n")
              for v in versions:
                  gv = ", ".join(v.get("game_versions", []))
                  f.write(f"## {v['version_number']} ({v['date_published'][:10]})\n\n")
                  f.write(f"- Minecraft: {gv} | Loaders: {', '.join(v.get('loaders', []))} | Type: {v.get('version_type')}\n\n")
                  body = (v.get("changelog") or "_No changelog provided._").strip()
                  f.write(body + "\n\n")

          if up_to_date:
              print("No new release — skipping pack re-sync.")
          else:
              primary = next((f for f in target["files"] if f.get("primary")), target["files"][0])
              print("downloading:", primary["filename"])

              data = get_bytes(primary["url"])
              z = zipfile.ZipFile(io.BytesIO(data))
              manifest = json.loads(z.read("modrinth.index.json"))

              if os.path.isdir("overrides"):
                  shutil.rmtree("overrides")
              os.makedirs("pack", exist_ok=True)

              for name in z.namelist():
                  if name.startswith("overrides/") and not name.endswith("/"):
                      os.makedirs(os.path.dirname(name), exist_ok=True)
                      with open(name, "wb") as out:
                          out.write(z.read(name))

              with open("pack/modrinth.index.json", "w") as f:
                  json.dump(manifest, f, indent=2)

              if os.path.isdir("releases"):
                  for fn in os.listdir("releases"):
                      os.remove(os.path.join("releases", fn))
              else:
                  os.makedirs("releases", exist_ok=True)
              with open(os.path.join("releases", primary["filename"]), "wb") as f:
                  f.write(data)

              def clean_name(path):
                  fname = path.split("/")[-1].replace(".jar", "")
                  fname = re.sub(r'[-_]?(fabric[-_]?)?1\.\d+(\.\d+)?.*$', '', fname, flags=re.I)
                  fname = re.sub(r'[-_]?v?\d+\.\d+(\.\d+)?.*$', '', fname)
                  fname = fname.replace('-', ' ').replace('_', ' ').strip()
                  return fname.title() if fname else path.split('/')[-1]

              rows = []
              for f in manifest["files"]:
                  name = clean_name(f["path"])
                  env = f.get("env", {})
                  side = "Both" if env.get("client") == "required" and env.get("server") == "required" else \
                         "Client" if env.get("client") == "required" else \
                         "Server" if env.get("server") == "required" else "Optional"
                  rows.append((name, f["path"].split("/")[-1], side))
              rows.sort(key=lambda r: r[0].lower())

              mc_dep = manifest["dependencies"].get("minecraft", "?")
              loader_dep = next((v for k, v in manifest["dependencies"].items() if k != "minecraft"), "?")

              with open("MODLIST.md", "w") as out:
                  out.write("# Mod List\n\n")
                  out.write(f"Source of truth: `pack/modrinth.index.json` (pack version **{target['version_number']}**, "
                            f"MC `{mc_dep}`). {len(rows)} mods, downloaded automatically by the Modrinth launcher.\n\n")
                  out.write("| Mod | File | Side |\n|---|---|---|\n")
                  for name, fname, side in rows:
                      out.write(f"| {name} | `{fname}` | {side} |\n")

                  extra_dir = "overrides/mods"
                  if os.path.isdir(extra_dir):
                      extra = sorted(os.listdir(extra_dir))
                      if extra:
                          out.write("\n## Bundled directly (not resolved via Modrinth API)\n\n")
                          for e in extra:
                              out.write(f"- `{e}`\n")

              with open("pack/VERSION", "w") as f:
                  f.write(f"{target['version_number']}\nminecraft={mc_dep}\nloader={loader_dep}\n")

              print("synced to", target["version_number"], "-", len(rows), "mods")
          PYEOF
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Auto-sync from Modrinth"
            git push
          else
            echo "Nothing changed."
          fi
